<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Biz Bridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'expert-primary': '#3A5F76',
            'expert-secondary': '#6DA9D2',
            'expert-text': '#1F2D3D',
            'expert-border': '#C0C0C0',
            'expert-success': '#059669',
            'expert-light-bg': '#f8f9fa',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-br from-expert-light-bg to-white min-h-screen">
  <div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-xl p-8">
        
<!-- Header -->
<div class="text-center mb-8">
  <div class="flex items-center justify-center gap-3 mb-4">
    
    <img src="{{ url_for('static', filename='images/logo.png') }}" 
         alt="Biz Bridge Logo" 
         class="w-12 h-12 object-contain" />

    <span class="text-xl font-medium text-expert-primary">Biz Bridge</span>
  </div>

  <h1 class="text-3xl font-medium text-expert-primary mb-2">Welcome Back</h1>
  <p class="text-expert-text">Sign in to your Biz Bridge account</p>
</div>


      <!-- Login Form -->
      <form id="login-form" class="space-y-6">
        <!-- Role Selection -->
        <div>
          <label class="block text-sm font-medium text-expert-text mb-3">Sign in as</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="relative cursor-pointer">
              <input type="radio" name="role" value="expert" class="sr-only peer" required>
              <div class="p-3 border-2 border-expert-border rounded-lg text-center transition-all peer-checked:border-expert-primary peer-checked:bg-expert-primary/5 hover:border-expert-secondary">
                <span class="text-sm font-medium text-expert-text">Expert</span>
              </div>
            </label>
            <label class="relative cursor-pointer">
              <input type="radio" name="role" value="business" class="sr-only peer" required>
              <div class="p-3 border-2 border-expert-border rounded-lg text-center transition-all peer-checked:border-expert-primary peer-checked:bg-expert-primary/5 hover:border-expert-secondary">
                <span class="text-sm font-medium text-expert-text">Business</span>
              </div>
            </label>
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-medium text-expert-text mb-2">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email"
            required 
            class="w-full px-4 py-3 border border-expert-border rounded-lg focus:ring-2 focus:ring-expert-primary focus:border-transparent bg-white outline-none transition-all"
            placeholder="your@email.com"
          >
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-expert-text mb-2">Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              name="password"
              required 
              class="w-full px-4 py-3 border border-expert-border rounded-lg focus:ring-2 focus:ring-expert-primary focus:border-transparent bg-white outline-none transition-all"
              placeholder="Enter your password"
            >
            <button 
              type="button" 
              id="toggle-password"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-expert-text hover:text-expert-primary border-none bg-transparent cursor-pointer"
            >
              <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
              <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
              </svg>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="login-button"
          class="w-full bg-expert-primary hover:bg-expert-primary/90 text-white py-3 px-4 rounded-lg font-medium border-none cursor-pointer flex items-center justify-center gap-2 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span id="login-text">Sign In</span>
          <div id="login-loading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin hidden"></div>
        </button>
      </form>

      <!-- Error Message -->
      <div id="error-message" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm hidden">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span id="error-text"></span>
        </div>
      </div>

      <!-- Success Message -->
      <div id="success-message" class="mt-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm hidden">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span id="success-text"></span>
        </div>
      </div>

     <!-- Switch to Signup -->
<div class="text-center mt-6">
  <p class="text-expert-text">
    Don't have an account?
    <a href="{{ url_for('signup_page') }}"
       class="text-expert-primary hover:text-expert-primary/80 font-medium bg-transparent hover:underline">
      Sign Up
    </a>
  </p>
</div>

<script>
  // Password toggle functionality
  document.getElementById('toggle-password').addEventListener('click', () => {
      const passwordInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eye-open');
      const eyeClosed = document.getElementById('eye-closed');
      
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      
      if (type === 'text') {
          eyeOpen.classList.add('hidden');
          eyeClosed.classList.remove('hidden');
      } else {
          eyeOpen.classList.remove('hidden');
          eyeClosed.classList.add('hidden');
      }
  });

  // Form submission
  document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const button = document.getElementById('login-button');
      const buttonText = document.getElementById('login-text');
      const loading = document.getElementById('login-loading');
      const errorMessage = document.getElementById('error-message');
      const successMessage = document.getElementById('success-message');
      
      // Show loading state
      button.disabled = true;
      buttonText.textContent = 'Signing In...';
      loading.classList.remove('hidden');
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');
      
      const formData = new FormData(e.target);
      const data = {
          role: formData.get('role'),
          email: formData.get('email'),
          password: formData.get('password')
      };
      
      try {
          const response = await fetch('/api/signin', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json'
              },
              body: JSON.stringify(data),
              credentials: 'same-origin'   
          });
          
          const result = await response.json();
          
          if (response.ok) {
              successMessage.classList.remove('hidden');
              document.getElementById('success-text').textContent = result.message || 'Signed in successfully!';
              
              // Store user data and redirect based on role
              localStorage.setItem('user', JSON.stringify(result.user));
              
              setTimeout(() => {
                window.location.href = '/home1.html';
              }, 1500);
          } else {
              errorMessage.classList.remove('hidden');
              document.getElementById('error-text').textContent = result.error || 'Invalid credentials. Please try again.';
          }
      } catch (error) {
          errorMessage.classList.remove('hidden');
          document.getElementById('error-text').textContent = 'Network error. Please check your connection and try again.';
      } finally {
          // Reset button state
          button.disabled = false;
          buttonText.textContent = 'Sign In';
          loading.classList.add('hidden');
      }
  });

  // Auto-focus email field
  document.getElementById('email').focus();
</script>

</body>
</html>
